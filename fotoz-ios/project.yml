name: Fotoz
options:
  bundleIdPrefix: com.mivy
  developmentLanguage: vi
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: complete

packages:
  FotozKit:
    path: Packages/FotozKit

targets:
  Fotoz:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Fotoz
    dependencies:
      - package: FotozKit
        product: FotozCore
      - package: FotozKit
        product: FotozDesign
      - package: FotozKit
        product: FeatureIDPhoto
      - package: FotozKit
        product: FeatureDocuments
      - package: FotozKit
        product: FeatureAvatar
      - package: FotozKit
        product: FeatureSettings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mivy.fotoz
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGNING_ALLOWED: "NO"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: "Fotoz dùng camera để chụp ảnh thẻ ngay trên máy. Ảnh không được gửi lên máy chủ."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Fotoz cần truy cập thư viện ảnh để bạn chọn ảnh có sẵn. Ảnh được xử lý ngay trên máy."
