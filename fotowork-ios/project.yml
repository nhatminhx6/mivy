name: Fotowork
options:
  bundleIdPrefix: com.mivy
  developmentLanguage: vi
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: complete

packages:
  FotoworkKit:
    path: Packages/FotoworkKit

targets:
  Fotowork:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Fotowork
    dependencies:
      - package: FotoworkKit
        product: FotoworkCore
      - package: FotoworkKit
        product: FotoworkDesign
      - package: FotoworkKit
        product: FeatureIDPhoto
      - package: FotoworkKit
        product: FeatureDocuments
      - package: FotoworkKit
        product: FeatureAvatar
      - package: FotoworkKit
        product: FeatureSettings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mivy.fotowork
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGNING_ALLOWED: "NO"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: "Fotowork dùng camera để chụp ảnh thẻ ngay trên máy. Ảnh không được gửi lên máy chủ."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Fotowork cần truy cập thư viện ảnh để bạn chọn ảnh có sẵn. Ảnh được xử lý ngay trên máy."
