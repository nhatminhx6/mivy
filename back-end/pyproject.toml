[project]
name = "mivy-backend"
version = "0.1.0"
description = "Local-first backend foundation for Mivy"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiofiles>=24.1.0,<25",
  "aiosqlite>=0.20.0,<1",
  "fastapi>=0.115.0,<1",
  "httpx>=0.27.0,<1",
  "pydantic-settings>=2.5.0,<3",
  "python-multipart>=0.0.12,<1",
  "sqlalchemy[asyncio]>=2.0.35,<3",
  "uvicorn[standard]>=0.30.0,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<9",
  "pytest-asyncio>=0.24.0,<1",
  "ruff>=0.7.0,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
